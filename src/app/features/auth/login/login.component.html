<app-auth-layout
  title="¡Bienvenido!"
  subtitle="Inicia sesión para continuar con tus tareas"
  visualTitle="Organiza tu vida, una tarea a la vez"
  visualDescription="Gestiona tus tareas de manera eficiente y mantén el control de tus proyectos con nuestra aplicación intuitiva."
  visualIcon="checklist_rtl"
>
  <!-- Formulario -->
  <form auth-form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <mat-form-field class="full-width" appearance="outline">
      <mat-label>Correo electrónico</mat-label>
      <input
        matInput
        type="email"
        formControlName="email"
        placeholder="tu@correo.com"
        autocomplete="email"
      >
      <mat-icon matPrefix>mail_outline</mat-icon>
      <mat-error *ngIf="loginForm.get('email')?.invalid">
        {{ getErrorMessage('email') }}
      </mat-error>
    </mat-form-field>

    <mat-form-field class="full-width" appearance="outline">
      <mat-label>Contraseña</mat-label>
      <input
        matInput
        [type]="hidePassword ? 'password' : 'text'"
        formControlName="password"
        placeholder="••••••••"
        autocomplete="current-password"
      >
      <mat-icon matPrefix>lock_outline</mat-icon>
      <button
        mat-icon-button
        matSuffix
        type="button"
        (click)="hidePassword = !hidePassword"
        [attr.aria-label]="'Mostrar/Ocultar contraseña'"
        [attr.aria-pressed]="hidePassword"
      >
        <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error *ngIf="loginForm.get('password')?.invalid">
        {{ getErrorMessage('password') }}
      </mat-error>
    </mat-form-field>

    <button
      mat-raised-button
      color="primary"
      type="submit"
      class="full-width submit-button"
      [disabled]="loginForm.invalid || loading"
    >
      <span *ngIf="!loading">Iniciar Sesión</span>
      <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
    </button>
  </form>

  <!-- Footer -->
  <p auth-footer class="text-center">
    ¿No tienes cuenta?
    <a routerLink="/auth/register" class="link">Créala aquí</a>
  </p>
</app-auth-layout>
